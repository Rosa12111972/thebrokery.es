<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro equipo | The Brokery España</title>
<meta name="description" content="Conoce al equipo de The Brokery España.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23231f20%22/><text x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22Arial,sans-serif%22 letter-spacing=%222%22>TB</text></svg>">

<link rel="stylesheet" href="brokery.css">
</head>
<body>

<header id="top" data-solid data-plantilla></header>

<section class="page-top" style="background:#fff;">
  <div class="wrap">
    <div class="breadcrumb"><a href="boutique.html">Inicio</a> / <a href="boutique.html#equipo">Equipo</a> / <span id="migaNombre"></span></div>
    <div id="agente"></div>
  </div>
</section>

<section class="alt" id="otrosSec">
  <div class="wrap">
    <div class="center" style="margin-bottom:50px;">
      <span class="eyebrow">Nuestro equipo</span>
      <h2 class="title">Conoce al resto del equipo</h2>
    </div>
    <div class="agent-others team-cards" id="otros"></div>
  </div>
</section>

<footer data-plantilla></footer>

<a class="wa-float" hidden href="#" data-wa="Hola, vengo de la web de The Brokery y quiero más información." target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.02 3C9.4 3 4 8.4 4 15.02c0 2.35.63 4.55 1.72 6.45L4 29l7.72-1.68a12 12 0 0 0 4.3.78c6.63 0 12.02-5.4 12.02-12.02C28.04 8.4 22.65 3 16.02 3zm0 21.9c-1.9 0-3.68-.5-5.22-1.4l-.37-.22-4.6 1 1.02-4.48-.24-.38a9.86 9.86 0 0 1-1.5-5.4c0-5.46 4.45-9.9 9.91-9.9 5.46 0 9.9 4.44 9.9 9.9 0 5.47-4.44 9.9-9.9 9.9zm5.44-7.42c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.74-1.63-2.03-.17-.3-.02-.46.13-.6.13-.13.3-.35.44-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.71 2-1.4.25-.7.25-1.29.17-1.4-.07-.13-.27-.2-.57-.35z"/></svg>
</a>

<script src="legal-data.js"></script>
<script src="brokery-comun.js"></script>
<script>
/* ---------- página individual de cada persona (agente.html?id=…) ---------- */
const id = new URLSearchParams(location.search).get('id');
const a = EQUIPO.find(x => x.id === id) || EQUIPO[0];
const nombreCorto = a.nombre.split(' ')[0];
document.title = `${a.nombre} | The Brokery España`;
$('#migaNombre').textContent = a.nombre;

const bio = a.bio && a.bio.length
  ? a.bio.map(t => `<p>${esc(t)}</p>`).join('')
  : `<p>${esc(nombreCorto)} forma parte del equipo de The Brokery España como ${esc(a.cargo.toLowerCase())}${a.subcargo ? ` (${esc(a.subcargo)})` : ''}. Acompañamos a propietarios, compradores e inversores en operaciones residenciales de alto standing en la Comunidad de Madrid, con un enfoque cercano, transparente y basado en datos.</p>
     <p>Si quieres vender, comprar o invertir, escríbele directamente: te responderá personalmente.</p>`;

$('#agente').innerHTML = `
  <div class="agent-grid">
    <div class="agent-photo" style="background-image:url('${esc(a.foto)}')" role="img" aria-label="${esc(a.nombre)}"></div>
    <div>
      <h1 class="agent-name">${esc(a.nombre)}</h1>
      <div class="agent-role">${esc(a.cargo)}${a.subcargo ? `<br><small>${esc(a.subcargo)}</small>` : ''}</div>
      <div class="agent-contact">
        ${a.telefono ? `<p><a href="${telHref(a.telefono)}">${esc(a.telefono)}</a></p>` : ''}
        <p><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></p>
      </div>
      <h2 class="ficha-h">Sobre ${esc(nombreCorto)}</h2>
      <div class="agent-bio">${bio}</div>
      ${a.especialidades && a.especialidades.length ? `<h2 class="ficha-h">Especialidades</h2><ul class="agent-tags">${a.especialidades.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${a.idiomas && a.idiomas.length ? `<h2 class="ficha-h">Idiomas</h2><ul class="agent-tags">${a.idiomas.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <h2 class="ficha-h">Escribe a ${esc(nombreCorto)}</h2>
      <form id="agenteForm" novalidate>
        <input type="hidden" name="Para" value="${esc(a.nombre)}">
        <div class="row">
          <div class="field"><label for="aNombre">Nombre *</label><input id="aNombre" name="Nombre" required autocomplete="name"></div>
          <div class="field"><label for="aTel">Teléfono *</label><input id="aTel" name="Teléfono" type="tel" required autocomplete="tel"></div>
        </div>
        <div class="field"><label for="aEmail">Email</label><input id="aEmail" name="Email" type="email" autocomplete="email"></div>
        <div class="field"><label for="aMsg">Mensaje</label><textarea id="aMsg" name="Mensaje"></textarea></div>
        <div class="rgpd-box" data-rgpd></div>
        <label class="check"><input type="checkbox" name="privacidad" required> <span>He leído y acepto la <a href="privacidad.html" target="_blank" style="color:var(--accent);text-decoration:underline;">Política de Privacidad</a>. *</span></label>
        <label class="check"><input type="checkbox" name="comercial"> <span>Acepto recibir comunicaciones comerciales (opcional).</span></label>
        <button type="submit" class="btn btn-dark">Enviar mensaje</button>
        <p class="form-msg" role="status"></p>
      </form>
    </div>
  </div>`;
rellenarLegal($('#agente'));

// El mensaje va directamente al email de esta persona
$('#agenteForm').addEventListener('submit', e => {
  e.preventDefault();
  if(!validate(e.target)) return;
  const lines = [`Mensaje para ${a.nombre} desde la web de The Brokery`];
  for(const [k, v] of new FormData(e.target).entries()){
    if(k === 'privacidad' || k === 'comercial' || k === 'Para') continue;
    if(v && String(v).trim()) lines.push(`${k}: ${v}`);
  }
  lines.push('Política de privacidad: aceptada');
  lines.push(`Comunicaciones comerciales: ${e.target.comercial.checked ? 'sí' : 'no'}`);
  location.href = `mailto:${a.email}?subject=${encodeURIComponent('Contacto desde la web de The Brokery')}&body=${encodeURIComponent(lines.join('\n'))}`;
  trackMeta('Lead', {content_name: `Contacto ${a.nombre}`});
  e.target.querySelector('.form-msg').textContent = 'Se ha abierto tu correo con tu mensaje. ¡Gracias!';
});

$('#otros').innerHTML = EQUIPO.filter(x => x.id !== a.id).map(x => tarjetaEquipo({...x, lead:false})).join('');
</script>
<script src="cookie-consent.js"></script>
</body>
</html>
